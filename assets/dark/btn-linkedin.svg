<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" width="210" height="44" role="img" aria-label="LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>LinkedIn</title><style>@font-face{font-family:Jb;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{text-rendering:geometricPrecision;font-variant-ligatures:contextual}
.in{animation:in 1s ease-out both}.rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.45,.05,.25,1) both}
.breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes in{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}@keyframes blink{0%{opacity:1}50%{opacity:0}}
